<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HobbyHub | Notifications</title>

    <link rel="stylesheet" href="notifications-style.css">
</head>

<body>

<header class="navbar">

    <a href="../index/index.html" class="logo">
        ✦ Hobby<span>Hub</span>
    </a>

    <nav>
        <a href="../home/home.html">Home</a>
        <a href="../explore/explore.html">Explore</a>
        <a href="../community/community.html">Community</a>
        <a href="../create-community/create-community.html">Create</a>
        <a href="../profile/profile.html">Profile</a>
        <a href="notifications.html" class="active">🔔</a>
    </nav>

</header>

<main>

    <div class="page-heading">

        <div>
            <p class="small-title">STAY UPDATED</p>

            <h1>Notifications 🔔</h1>

            <p class="subtitle">
                See what's happening in your hobby communities.
            </p>
        </div>

        <button
            class="read-btn"
            id="markAllReadBtn"
            onclick="markAllRead()">
            ✓ Mark all as read
        </button>

    </div>


    <section
        class="notification-container"
        id="notificationContainer">
    </section>


    <div
        class="empty-message"
        id="emptyMessage"
        style="display: none;">

        <div>🔔</div>

        <h2>You're all caught up!</h2>

        <p>No new notifications.</p>

    </div>

</main>


<script src="notifications-script.js"></script>

</body>
</html>
