<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communities - HobbyHub</title>

    <link rel="stylesheet" href="community-style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Hobby<span>Hub</span>
    </div>

    <div class="nav-links">

        <a href="../home/home.html">
            Home
        </a>

        <a href="../explore/explore.html">
            Explore
        </a>

        <a class="active" href="community.html">
            Communities
        </a>

        <a href="../notifications/notifications.html">
            🔔
        </a>

        <a href="../profile/profile.html">
            👤
        </a>

    </div>

</nav>


<main>

    <!-- Hero Section -->

    <section class="hero">

        <div>

            <span class="badge">
                👥 HOBBY COMMUNITIES
            </span>

            <h1>
                Find Your <span>Community</span>
            </h1>

            <p>
                Connect with people who share your hobbies,
                exchange ideas and grow together.
            </p>

        </div>


        <a
            class="create-btn"
            href="../create-community/create-community.html">

            + Create Community

        </a>

    </section>



    <!-- Search -->

    <section class="search-section">

        <input
            type="text"
            id="communitySearch"
            placeholder="🔍 Search communities..."
        >

    </section>



    <!-- Categories -->

    <div class="categories">

        <button
            class="category active"
            data-category="all"
            type="button">

            All

        </button>


        <button
            class="category"
            data-category="creative"
            type="button">

            🎨 Creative

        </button>


        <button
            class="category"
            data-category="reading"
            type="button">

            📚 Reading

        </button>


        <button
            class="category"
            data-category="entertainment"
            type="button">

            🎵 Entertainment

        </button>


        <button
            class="category"
            data-category="technology"
            type="button">

            💻 Technology

        </button>


        <button
            class="category"
            data-category="food"
            type="button">

            🍳 Food

        </button>


    </div>



    <!-- Community Cards -->

    <section class="community-grid">

        <!-- JavaScript will load communities from database -->

    </section>



    <!-- No Results -->

    <div
        class="no-results"
        id="noResults"
        style="display: none;">

        <h3>
            No communities found 🔍
        </h3>

        <p>
            Try searching for another hobby or category.
        </p>

    </div>

</main>


<script src="community-script.js"></script>

</body>
</html>
