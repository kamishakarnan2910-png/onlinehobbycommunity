<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HobbyHub | Verify Email</title>

    <link rel="stylesheet" href="verify-style.css">
</head>

<body>

<div class="verify-page">

    <a href="../index/index.html" class="logo">
        ✦ HobbyHub
    </a>

    <div class="verify-card">

        <div class="icon">
            ✉️
        </div>

        <div class="badge">
            ACCOUNT VERIFICATION
        </div>

        <h1>Verify Your Email</h1>

        <p class="description">
            We've sent a verification code to your email address.
            Enter the 6-digit code below to continue.
        </p>

        <form id="verifyForm">

            <div class="code-boxes">

                <input type="text" maxlength="1" class="code">
                <input type="text" maxlength="1" class="code">
                <input type="text" maxlength="1" class="code">
                <input type="text" maxlength="1" class="code">
                <input type="text" maxlength="1" class="code">
                <input type="text" maxlength="1" class="code">

            </div>

            <p id="message"></p>

            <button type="submit">
                Verify Email →
            </button>

        </form>

        <div class="resend">
            Didn't receive the code?

            <a href="#" id="resendBtn">
                Resend Code
            </a>
        </div>

        <a href="../register/register.html" class="back">
            ← Back to Register
        </a>

    </div>

    <p class="footer-text">
        © 2026 HobbyHub · Connect through hobbies. Grow together.
    </p>

</div>

<script src="verify-script.js"></script>

</body>
</html>
