<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Posts - HobbyHub</title>

    <link
        rel="stylesheet"
        href="posts-style.css">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">
        Hobby<span>Hub</span>
    </div>


    <div class="nav-links">

        <a href="../home/home.html">
            Home
        </a>

        <a href="../explore/explore.html">
            Explore
        </a>

        <a
            href="../community/community.html"
            class="active">
            Communities
        </a>

        <a href="../notifications/notifications.html">
            🔔
        </a>

        <a href="../profile/profile.html">
            👤
        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="posts-page">


    <!-- COMMUNITY HEADER -->

    <section class="posts-header">

        <div>

            <span class="badge">
                HOBBY COMMUNITY
            </span>


            <h1 id="communityName">
                Community Posts
            </h1>


            <p id="communityDescription">
                Explore posts shared by community members.
            </p>

        </div>

    </section>



    <!-- POSTS -->

    <section class="posts-section">

        <div
            id="postsContainer"
            class="posts-container">

            <p>
                Loading posts...
            </p>

        </div>

    </section>



    <!-- BACK BUTTON -->

    <a
        href="../community/community.html"
        class="back-btn">

        ← Back to Communities

    </a>


</main>



<!-- =====================================================
     VIEW POST MODAL
===================================================== -->

<div
    id="postModal"
    class="post-modal">


    <div
        class="post-modal-box">


        <!-- CLOSE BUTTON -->

        <button
            type="button"
            id="closePostModal"
            class="close-modal">

            ×

        </button>



        <!-- MODAL CONTENT -->

        <div
            id="postModalContent"
            class="post-modal-content">

        </div>


    </div>

</div>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script src="posts-script.js"></script>


<!-- =====================================================
     MODAL CLOSE
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const modal =
            document.getElementById(
                "postModal"
            );


        const closeButton =
            document.getElementById(
                "closePostModal"
            );


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                function () {

                    modal.style.display =
                        "none";

                }
            );

        }


        if (modal) {

            modal.addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.style.display =
                            "none";

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
