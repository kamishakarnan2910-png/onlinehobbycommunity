<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HobbyConnect - Profile</title>

    <link rel="stylesheet" href="profile-style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Hobby<span>Connect</span>
    </div>

    <nav>
        <a href="../home/home.html">Home</a>
        <a href="../explore/explore.html">Explore</a>
        <a href="../community/community.html">Community</a>
        <a href="../create-community/create-community.html">Create</a>
        <a href="profile.html" class="active">Profile</a>
    </nav>

</header>


<main>

    <!-- Profile Section -->
    <section class="profile-container">

        <div class="profile-cover"></div>

        <div class="profile-content">

            <div class="profile-image" id="profileImage">
                U
            </div>

            <div class="profile-info">

                <h1 id="profileName">Loading...</h1>

                <p class="username" id="profileUsername"></p>

                <p class="bio" id="profileBio">
                    Loading profile...
                </p>

                <div class="profile-details">

                    <span id="profileLocation"></span>

                    <span id="profileEducation"></span>

                </div>

            </div>

            <!-- Edit Profile -->
            <a href="../edit-profile/edit-profile.html" class="edit-btn">
                ✏️ Edit Profile
            </a>

        </div>


        <!-- Profile Stats -->
        <div class="stats">

            <div>
                <h2 id="communityCount">0</h2>
                <p>Communities</p>
            </div>

            <div>
                <h2 id="postCount">0</h2>
                <p>Posts</p>
            </div>

            <div>
                <h2 id="followerCount">0</h2>
                <p>Followers</p>
            </div>

        </div>

    </section>


    <!-- My Hobbies -->
    <section class="section">

        <h2>My Hobbies 🎨</h2>

        <div class="hobby-list" id="hobbyList">

            <p>Loading hobbies...</p>

        </div>

    </section>


    <!-- My Communities -->
    <section class="section">

        <div class="section-title">

            <h2>My Communities 👥</h2>

            <a href="../community/community.html">
                View All
            </a>

        </div>

        <div class="community-list" id="communityList">

            <p>Loading communities...</p>

        </div>

    </section>

</main>


<script src="profile-script.js"></script>

</body>
</html>
