<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Members - HobbyHub</title>

    <link rel="stylesheet" href="members-style.css">
</head>

<body>

<div class="page">

    <header class="topbar">

        <div>
            <h1>Community Members</h1>
            <p>View and manage community members.</p>
        </div>

        <button id="backButton">
            ← Back
        </button>

    </header>


    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search members..."
        >

        <button id="searchButton">
            Search
        </button>

    </section>


    <div id="message"></div>


    <section id="membersContainer">

        <!-- Members will be loaded from backend -->

    </section>


    <div
        id="noResult"
        class="no-result"
        style="display: none;"
    >
        No members found.
    </div>

</div>


<script src="members-script.js"></script>

</body>
</html>
