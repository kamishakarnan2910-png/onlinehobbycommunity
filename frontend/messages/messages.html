<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HobbyHub | Messages</title>

    <link rel="stylesheet" href="messages-style.css">
</head>

<body>

<header class="navbar">

    <a href="../index/index.html" class="logo">
        ✦ Hobby<span>Hub</span>
    </a>

    <nav>
        <a href="../home/home.html">Home</a>
        <a href="../explore/explore.html">Explore</a>
        <a href="../community/community.html">Community</a>
        <a href="../create-community/create-community.html">Create</a>
        <a href="../profile/profile.html">Profile</a>
        <a href="../notifications/notifications.html">🔔</a>
        <a href="messages.html" class="active">💬</a>
        <a href="../settings/settings.html">⚙️</a>
        <a href="../help/help.html">Help</a>
    </nav>

</header>


<main>

    <section class="page-heading">

        <p class="small-title">
            CONNECT WITH PEOPLE
        </p>

        <h1>
            Messages 💬
        </h1>

        <p>
            Chat with people who share your hobbies and interests.
        </p>

    </section>


    <section class="chat-container">


        <!-- Conversations -->

        <div class="conversation-panel">

            <div class="conversation-heading">

                <h2>
                    Chats
                </h2>

                <button
                    type="button"
                    onclick="newChat()">
                    ＋
                </button>

            </div>


            <div class="search-box">

                <span>
                    🔍
                </span>

                <input
                    type="text"
                    id="searchChat"
                    placeholder="Search chats..."
                    onkeyup="searchChats()"
                >

            </div>


            <!-- Dynamic chat list -->

            <div
                class="chat-list"
                id="chatList">

                <div class="empty-chats">

                    <h3>
                        Loading chats...
                    </h3>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>

        </div>


        <!-- Chat Area -->

        <div class="message-panel">


            <div class="message-header">

                <div
                    class="avatar purple"
                    id="chatAvatar">
                    ?
                </div>

                <div>

                    <h2 id="chatName">
                        Select a chat
                    </h2>

                    <p id="chatStatus">
                        💬 No conversation selected
                    </p>

                </div>

            </div>


            <!-- Dynamic messages -->

            <div
                class="messages"
                id="messages">

                <div class="empty-messages">

                    <h3>
                        No chat selected
                    </h3>

                    <p>
                        Select a person to start messaging.
                    </p>

                </div>

            </div>


            <div class="message-input">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    onkeydown="handleEnter(event)"
                    disabled
                >

                <button
                    type="button"
                    onclick="sendMessage()"
                    disabled
                    id="sendButton">

                    ➤

                </button>

            </div>

        </div>

    </section>

</main>


<script src="messages-script.js"></script>

</body>

</html>
